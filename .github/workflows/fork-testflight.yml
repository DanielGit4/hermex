# Fork-only: build, sign and upload daniel/main to TestFlight under Daniel's own
# Apple Developer team. Dormant until the repository variable FORK_TESTFLIGHT_ENABLED
# is "true" and these secrets exist:
#   APPLE_TEAM_ID, APP_STORE_CONNECT_KEY_ID, APP_STORE_CONNECT_ISSUER_ID,
#   APP_STORE_CONNECT_PRIVATE_KEY (the .p8 contents)
# Signing is automatic with the App Store Connect API key (-allowProvisioningUpdates).
name: Fork TestFlight

on:
  push:
    branches: [daniel/main]
  workflow_dispatch:

concurrency:
  group: fork-testflight
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  upload:
    if: github.repository == 'DanielGit4/hermex' && vars.FORK_TESTFLIGHT_ENABLED == 'true'
    runs-on: macos-26
    timeout-minutes: 60
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Write signing identity override
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          cat > Config/Local.xcconfig <<EOF
          DEVELOPMENT_TEAM = ${TEAM_ID}
          APP_BUNDLE_IDENTIFIER = com.danielgit4.hermexdev\$(APP_IDENTIFIER_SUFFIX)
          APP_GROUP_IDENTIFIER = group.com.danielgit4.hermexdev\$(APP_IDENTIFIER_SUFFIX)
          EOF

      - name: Install App Store Connect key
        env:
          ASC_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/asc"
          printf '%s' "$ASC_KEY" > "$RUNNER_TEMP/asc/AuthKey_${ASC_KEY_ID}.p8"
          echo "ASC_KEY_PATH=$RUNNER_TEMP/asc/AuthKey_${ASC_KEY_ID}.p8" >> "$GITHUB_ENV"

      - name: Archive
        run: |
          set -euo pipefail
          build_number=$(date -u +%Y%m%d%H%M)
          xcodebuild archive \
            -project HermesMobile.xcodeproj -scheme HermesMobile -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/Hermex.xcarchive" \
            -xcconfig Config/ForkDev.xcconfig \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            CURRENT_PROJECT_VERSION="$build_number" | tail -40

      - name: Export and upload
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/export.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>${TEAM_ID}</string>
            <key>signingStyle</key><string>automatic</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict></plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Hermex.xcarchive" -exportOptionsPlist "$RUNNER_TEMP/export.plist" \
            -exportPath "$RUNNER_TEMP/export" -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID" | tail -40
