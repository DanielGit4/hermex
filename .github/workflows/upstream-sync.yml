# Fork-only: keep `master` equal to upstream. The Hermes cron job "hermex upstream
# sync" then opens the master -> daniel/main PR with Daniel's gh token (the Actions
# token on this fork is refused createPullRequest) and files a Kanban card when the
# PR conflicts or CI fails.
name: Upstream Sync

on:
  schedule:
    - cron: "17 5 * * 1"   # Mondays 05:17 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    if: github.repository == 'DanielGit4/hermex'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: master

      - name: Fast-forward master to upstream
        run: |
          set -euo pipefail
          git remote add upstream https://github.com/uzairansaruzi/hermex.git
          git fetch upstream master
          git merge --ff-only upstream/master
          git push origin master

